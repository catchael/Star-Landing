<body>
  <div id="game"></div><div id="nebula"></div><div id="boostBlur"></div><div id="impactFlash"></div>
  <div class="hud">
    <div class="panel">
      <div class="title">STAR LANDING // DEEP SPACE</div>

    <div class="monitorScreen"><video id="cameraFeed" autoplay muted playsinline></video><button id="cameraStart">啟動攝影機並開始校正</button><div class="monitorScan"></div><div class="poseGuide" id="poseGuide"></div><div class="monitorText" id="monitorText">按下按鈕後，攝影機預覽和校正都會在本頁進行</div><div class="monitorCount" id="monitorCount"></div><div class="monitorProgress"><i id="monitorProgressBar"></i></div></div>

  </aside>
  <section id="cockpitDash">

      <div class="dashGauge"><div class="dashLabel">ENERGY</div><div class="dashValue" id="energyText">100%</div><div class="dashLine"><i id="energyBar"></i></div></div>
      <div class="dashGauge"><div class="dashLabel">APPROACH</div><div class="dashValue" id="distanceText">0%</div><div class="dashLine"><i id="distanceBar"></i></div></div>

    </div>

  </section>
  <button id="reset">重新開始任務</button>
<script>
  window.starGestureReady=false;
  window.addEventListener('load',()=>setTimeout(()=>{
    if(!document.querySelector('#game canvas')){const m=document.querySelector('#message');document.querySelector('#msgTitle').textContent='3D 畫面載入失敗';document.querySelector('#msgSub').textContent='請確認 App Lab 的 vendor 檔案都已完整上傳，再重新整理。';m.classList.add('show');}
  },5000));
  document.addEventListener('click',e=>{if(e.target.id==='cameraStart')setTimeout(()=>{if(!window.starGestureReady){e.target.disabled=false;e.target.textContent='手勢模組未載入，請確認檔案';document.querySelector('#monitorText').textContent='請確認 vendor/package/ 及 gesture_recognizer.task 已完整放入 App Lab 的 assets。';}},1500);},true);
</script>
<script type="module">
  import * as THREE from '/vendor/three.module.js';
  const root=document.querySelector('#game');
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x080611,.0018);
  // Keep the station in view from mission start; it is 520 world units away.
  const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,900);
  camera.rotation.order='YXZ';camera.position.set(0,0,0);
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xb9d4ff,0x251334,2.2));
  const keyLight=new THREE.DirectionalLight(0xb8cfff,1.5);keyLight.position.set(-8,10,12);scene.add(keyLight);
  const cyanLight=new THREE.PointLight(0x34d9ff,14,90);cyanLight.position.set(0,0,-40);scene.add(cyanLight);
  let aspect=innerWidth/innerHeight;
  function resize(){aspect=innerWidth/innerHeight;camera.aspect=aspect;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}

  // Place particles across the camera frustum so the field stays present at start and end.
  function placeFieldPoint(point,minDepth=18,maxDepth=270){
    const depth=minDepth+Math.random()*(maxDepth-minDepth),halfHeight=Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*depth;
    point.x=camera.position.x+(Math.random()-.5)*2*halfHeight*aspect*1.12;
    point.y=camera.position.y+(Math.random()-.5)*2*halfHeight*1.12;
    point.z=camera.position.z-depth;
  }
  const stars=[];const starPositions=new Float32Array(520*3),starColors=new Float32Array(520*3);
  const palette=[0xe8e4ff,0x70e7ff,0xffd882,0xdc86ff,0xa8f6df].map(c=>new THREE.Color(c));
  for(let i=0;i<520;i++){
    const s={x:0,y:0,z:0,size:.3+Math.random()*1.7};placeFieldPoint(s);stars.push(s);
    starPositions[i*3]=s.x;starPositions[i*3+1]=s.y;starPositions[i*3+2]=s.z;
    const c=palette[Math.floor(Math.random()*palette.length)];starColors.set([c.r,c.g,c.b],i*3);
  }
  const starGeometry=new THREE.BufferGeometry();starGeometry.setAttribute('position',new THREE.BufferAttribute(starPositions,3));starGeometry.setAttribute('color',new THREE.BufferAttribute(starColors,3));
  const starField=new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,vertexColors:true,size:.78,sizeAttenuation:true,transparent:true,opacity:.86}));scene.add(starField);
  const streaks=Array.from({length:100},()=>{const s={x:0,y:0,z:0,len:1.5+Math.random()*2.5,speed:8+Math.random()*18};placeFieldPoint(s,18,220);return s;});
  const streakPositions=new Float32Array(streaks.length*6),streakGeometry=new THREE.BufferGeometry();streakGeometry.setAttribute('position',new THREE.BufferAttribute(streakPositions,3));
  const streakField=new THREE.LineSegments(streakGeometry,new THREE.LineBasicMaterial({color:0x9ecaff,transparent:true,opacity:.68}));scene.add(streakField);

  // Distant space station, growing naturally in perspective as the mission advances.
  const station=new THREE.Group();scene.add(station);station.position.set(0,0,-520);
  const stationSteel=new THREE.MeshStandardMaterial({color:0x8099ad,metalness:.82,roughness:.3,emissive:0x101b34});
  const stationCore=new THREE.Mesh(new THREE.CylinderGeometry(3.2,4.1,12,12),stationSteel);stationCore.rotation.x=Math.PI/2;station.add(stationCore);
  const stationRing=new THREE.Mesh(new THREE.TorusGeometry(8,.38,12,72),new THREE.MeshStandardMaterial({color:0x56f1dc,emissive:0x158b83,emissiveIntensity:1.4,metalness:.62,roughness:.22}));station.add(stationRing);
  const stationRing2=new THREE.Mesh(new THREE.TorusGeometry(5.4,.18,10,64),new THREE.MeshStandardMaterial({color:0x79cfff,emissive:0x1a5b8b,emissiveIntensity:1.2}));stationRing2.rotation.x=.26;stationRing2.rotation.y=.2;station.add(stationRing2);
  for(const side of [-1,1]){
    const module=new THREE.Mesh(new THREE.BoxGeometry(4.2,3.1,8),stationSteel);module.position.set(side*8,0,-1);station.add(module);
    const solar=new THREE.Mesh(new THREE.BoxGeometry(1.1,14,.28),new THREE.MeshStandardMaterial({color:0x245782,metalness:.42,roughness:.3,emissive:0x0b1d39}));solar.position.set(side*12,0,-1);station.add(solar);
  }
  for(let i=0;i<12;i++){const beacon=new THREE.Mesh(new THREE.SphereGeometry(.32,8,8),new THREE.MeshBasicMaterial({color:0x79ffe6}));const a=i*Math.PI/6;beacon.position.set(Math.cos(a)*8,Math.sin(a)*8,0);station.add(beacon);}

  // Cockpit rim gives a first-person viewpoint without placing a ship sprite over the scene.
  const cockpit=new THREE.Group();camera.add(cockpit);scene.add(camera);
  const cockpitMat=new THREE.MeshStandardMaterial({color:0x222538,metalness:.78,roughness:.28,emissive:0x130d24});
  const cockpitEdge=new THREE.LineBasicMaterial({color:0xb08cd4,transparent:true,opacity:.66});
  const frameGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-5,-3.8,-7),new THREE.Vector3(-3.5,-2.55,-7),new THREE.Vector3(-1.15,-2.1,-7),new THREE.Vector3(0,-2.45,-7),new THREE.Vector3(1.15,-2.1,-7),new THREE.Vector3(3.5,-2.55,-7),new THREE.Vector3(5,-3.8,-7)]);
  cockpit.add(new THREE.Line(frameGeo,cockpitEdge));
  for(const side of [-1,1]){
    const fin=new THREE.Mesh(new THREE.BoxGeometry(1.05,.16,4.5),cockpitMat);fin.position.set(side*3.3,-3.1,-7);fin.rotation.z=side*.14;cockpit.add(fin);
    const finEdge=new THREE.LineSegments(new THREE.EdgesGeometry(fin.geometry),cockpitEdge);finEdge.position.copy(fin.position);finEdge.rotation.copy(fin.rotation);cockpit.add(finEdge);
    const lamp=new THREE.PointLight(side<0?0xbf58ff:0x39eaff,3,8);lamp.position.set(side*3,-2.9,-5);cockpit.add(lamp);
  }
  const noseLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-2.7,-7),new THREE.Vector3(0,-1.9,-7)]),new THREE.LineBasicMaterial({color:0x9cf7ff,transparent:true,opacity:.5}));cockpit.add(noseLine);

  let state={x:0,y:0,energy:100,distance:0,status:'flying',boost:false,connected:false,hull:3,score:0,fire_presses:0,calibration:{phase:'flight'}};
  let initializedState=false,lastFireCount=0,missionSeconds=0,lastFrame=performance.now(),spawnTimer=.4,eventSeq=0,impactUntil=0;
  let lastStateAt=0,statePolling=false;
  const meteors=[],shots=[],explosions=[];const rand=(a,b)=>a+Math.random()*(b-a);
  const pilotVelocity=new THREE.Vector3(),pilotRight=new THREE.Vector3(),pilotUp=new THREE.Vector3(),pilotForward=new THREE.Vector3();
  function makeAsteroid(radius,fast=false){
    const group=new THREE.Group();
    const geometry=new THREE.IcosahedronGeometry(radius,1),p=geometry.attributes.position;
    for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),len=Math.sqrt(x*x+y*y+z*z)||1,w=.82+Math.random()*.36;p.setXYZ(i,x/len*radius*w,y/len*radius*w,z/len*radius*w);}
    geometry.computeVertexNormals();

    if(calPhase==='takeoff'||calPhase==='launch')return;
    if(camVideo.readyState<2||camVideo.currentTime===lastVideoTime)return;
    lastVideoTime=camVideo.currentTime;
    const result=handTracker.recognizeForVideo(camVideo,now);
    const {hands,left:screenLeft,right:screenRight}=pilotHands(result);
    const L=screenLeft?.points,R=screenRight?.points;
    const readyGesture=hands.some(hand=>okaySign(hand.points));
    const bothVisible=!!(screenLeft&&screenRight);
    const span=bothVisible?screenRight.x-screenLeft.x:0;
    const roll=bothVisible?Math.atan2(screenLeft.y-screenRight.y,span*camVideo.videoWidth/camVideo.videoHeight):0;
    const leftHeight=screenLeft?.y??neutralLeft;
    const rightHeight=screenRight?.y??neutralRight;
    const leftLift=neutralLeft-leftHeight,rightLift=neutralRight-rightHeight;
    const tilt=angleDelta(roll,neutralRoll);
    const bothFists=bothVisible&&screenLeft.grip&&screenRight.grip;
    // In the player's view, a right turn lowers the right hand.
    const wheelTurn=-tilt;
    const lateral=scaledAxis(wheelTurn,rollDead,ranges.right,ranges.left);
    const levelForLift=Math.abs(tilt)<=levelAngle;
    const midpointLift=(leftLift+rightLift)/2;

    if(calPhase==='flight'){
      const rightPose=thumbState(screenRight,thumbProfiles.right,fireLatch);
      const leftPose=thumbState(screenLeft,thumbProfiles.left,boostLatch);
      const fired=actionPressed(fireLatch,rightPose,now);
      const boosted=actionPressed(boostLatch,leftPose,now);
      if(fired)fireEvents++;
      if(boosted)boostEvents++;
      if(fired||boosted){
        lastAction=[fired?'右手射擊':'',boosted?'左手衝刺':''].filter(Boolean).join('／');
        lastActionAt=now;
      }
      if(bothFists)lastGripAt=now;
      if(!bothVisible)lastGripAt=-Infinity;
      const steering=bothVisible&&now-lastGripAt<140;
      const horizontal=lateral*(reverseHorizontal?-1:1);
      const vertical=scaledAxis(midpointLift,.006,ranges.up*.7,ranges.down*.7);
      const magnitude=Math.max(1,Math.hypot(horizontal,vertical));
      const alpha=1-Math.exp(-Math.min(now-lastFlightFrame,100)/55);
      lastFlightFrame=now;
      flightX=steering?flightX+(horizontal/magnitude-flightX)*alpha:0;
      flightY=steering?flightY+(vertical/magnitude-flightY)*alpha:0;
      if(now-lastCalUi>120){
        const output=(value,positive,negative)=>Math.abs(value)<.03?'—':`${value>0?positive:negative}${Math.round(Math.abs(value)*100)}%`;
        const direction=!bothVisible?'請將雙手分開，維持在鏡像的左右兩側':!steering?'雙手其餘四指握拳以恢復方向控制'
          :`方向 ${output(flightX,'右','左')}／${output(flightY,'上','下')}`;
        const hint=lastAction&&now-lastActionAt<900?`${lastAction} · ${direction}`:direction;
        publishCal('flight',0,'飛行中',hint,0,false,0,!!screenLeft,!!screenRight);
        const handStatus=(hand,pose,latch)=>!hand?'未追蹤':pose?.pressed?'比讚':latch.armed?'就緒':'拇指搭回拳頭';
        document.querySelector('#leftHandState').textContent=`左 · ${handStatus(screenLeft,leftPose,boostLatch)} · ${boostEvents}`;
        document.querySelector('#rightHandState').textContent=`右 · ${handStatus(screenRight,rightPose,fireLatch)} · ${fireEvents}`;
        lastCalUi=now;
      }
      if(!inputPending&&(fired||boosted||now-lastGesturePost>=50)){
        inputPending=true;
        lastGesturePost=now;
        fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(1500),body:JSON.stringify({
          client_id:gestureClientId,seq:++controlSeq,x:flightX,y:flightY,fire_events:fireEvents,boost_events:boostEvents,
        })}).then(response=>{if(response.ok&&(fired||boosted))pullState();}).catch(()=>{}).finally(()=>{inputPending=false;});
      }
      return;
    }

    const [stepTitle,pose]=steps[calStage];
    let title=stepTitle,hint=pose,count=0,progress=0;
    if(calPhase==='ready'){
      hint=tiltNote+pose+'。準備好後，比 OK 開始倒數。';
      if(readyGesture){
        calStart=calStart||now;
        if(now-calStart>=450){calPhase='prepare';calStart=now;tiltNote='';}
      }else calStart=0;
    }else if(calPhase==='prepare'){
      count=Math.max(0,prepareSeconds-(now-calStart)/1000);
      hint='準備：'+pose;
      if(count===0){calPhase='record';samples=[];recordedMs=0;previousPoseFrame=0;}
    }else if(calPhase==='reviewTilt'){
      hint=`${pose}。比 OK 重錄，或使用預設靈敏度。`;
      if(readyGesture){
        calStart=calStart||now;
        if(now-calStart>=450){calPhase='prepare';calStart=now;}
      }else calStart=0;
    }else if(calPhase==='record'){
      const tiltStage=calStage===1||calStage===2;
      const rightExtended=thumbSample(screenRight,thumbProfiles.right);
      const leftExtended=thumbSample(screenLeft,thumbProfiles.left);
      const valid=[
        bothFists&&Math.abs(roll)<=levelAngle,
        bothVisible,
        bothVisible,
        bothVisible&&levelForLift&&midpointLift>=heightDead,
        bothVisible&&levelForLift&&midpointLift<=-heightDead,
        bothVisible&&rightExtended&&!leftExtended,
        bothVisible&&leftExtended&&!rightExtended,
      ][calStage];
      const duration=calStage<5?recordSeconds:1;
      if(samples.length&&now-samples.at(-1).time>(calStage>=3?1200:450)){
        samples=[];recordedMs=0;previousPoseFrame=0;
      }
      if(!valid){
        previousPoseFrame=0;
        hint='等候姿勢：'+pose;
        if(tiltStage){
          if(!bothVisible)hint='請將雙手分開，維持在鏡像的左右兩側。';
        }
        if(calStage>=5)hint=bothVisible?`${pose}，讓拇指和拳面之間的位置變化看得清楚。`:'請讓兩隻手同時入鏡。';
      }else{
        if(previousPoseFrame)recordedMs+=Math.min(now-previousPoseFrame,120);
        previousPoseFrame=now;
        samples.push({time:now,roll,leftHeight,rightHeight,wheelTurn,midpointLift,
          leftThumb:screenLeft.opening,rightThumb:screenRight.opening,
          leftAtRest:screenLeft.grip&&screenLeft.thumb<.5,rightAtRest:screenRight.grip&&screenRight.thumb<.5});
        hint='正在記錄：'+pose;
        if(tiltStage)hint+=`。目前判定向${wheelTurn>=0?'右':'左'}轉 ${Math.abs(wheelTurn/radians).toFixed(1)}°。`;
      }
      count=Math.max(0,duration-recordedMs/1000);
      progress=1-count/duration;
      if(valid){
        if(count===0){
          if(calStage===0){
            neutralRoll=median(samples.map(sample=>sample.roll));
            neutralLeft=median(samples.map(sample=>sample.leftHeight));
            neutralRight=median(samples.map(sample=>sample.rightHeight));
            thumbProfiles.left.rest=median(samples.map(sample=>sample.leftThumb));
            thumbProfiles.right.rest=median(samples.map(sample=>sample.rightThumb));
          }
          const axis=['','right','left','up','down'][calStage];
          if(tiltStage){
            const sign=calStage===1?1:-1;
            const correct=samples.filter(sample=>sample.wheelTurn*sign>=rollDead+2*radians);
            if(!correct.length||correct.at(-1).time-correct[0].time<700){
              calPhase='reviewTilt';calStart=0;
              publishCal(calPhase,calStage+1,title,`${pose}。比 OK 重錄，或使用預設靈敏度。`,0,false,0,!!L,!!R);
              lastCalUi=now;
              return;
            }
            ranges[axis]=median(correct.map(sample=>sample.wheelTurn*sign));
          }else if(axis){
            ranges[axis]=median(samples.map(sample=>Math.abs(sample.midpointLift)));
          }
          // Include the neutral grip seen during actual steering, not only straight flight.
          if(calStage<5){
            for(const side of ['left','right']){
              const atRest=calStage===0?samples:samples.filter(sample=>sample[side+'AtRest']);
              const profile=thumbProfiles[side];
              profile.restSamples.push(...thumbExamples(atRest,side+'Thumb'));
              const ordered=[...profile.restSamples].sort((a,b)=>a-b);
              profile.restHigh=ordered[Math.floor((ordered.length-1)*.9)]??profile.rest;
            }
          }
          if(calStage===5)learnThumbLevels(thumbProfiles.right,samples.map(sample=>sample.rightThumb));
          if(calStage===6)learnThumbLevels(thumbProfiles.left,samples.map(sample=>sample.leftThumb));
          if(calStage<steps.length-1){calStage++;calPhase='ready';calStart=0;}
          else{
            calPhase='takeoff';
            takeoffDeadline=now+takeoffSeconds*1000;
            publishCal('takeoff',0,'校正完成','雙拳回到胸前，倒數結束後起飛。',takeoffSeconds,false,0,!!L,!!R);
            lastCalUi=now;
            return;
          }
        }
      }
    }
    if(now-lastCalUi>75){
      publishCal(calPhase,calStage+1,title,hint,count,calPhase==='record',progress,!!L,!!R);
      lastCalUi=now;
    }
  }
  function flightInput(now){
    if(!gestureOn)return [state.x||0,state.y||0];
    if(calPhase==='flight'&&now-lastFlightFrame<200)return [flightX,flightY];
    return [0,0];
  }
  function updateCockpitState(){
    const [x,y]=flightInput(performance.now());
    document.querySelector('#stickRod').style.transform=`rotateZ(${x*22}deg) rotateX(${y*18}deg)`;
    document.querySelector('#stickKnob').style.transform=`translate(${x*13}px,${-y*9}px)`;
  }
  function updateHud(dt){
    const ep=Math.max(0,Math.min(100,state.energy||0)),dp=Math.max(0,Math.min(100,(state.distance||0)/30*100));
    document.querySelector('#energyText').textContent=`${Math.round(ep)}%`;document.querySelector('#energyBar').style.width=`${ep}%`;
    document.querySelector('#distanceText').textContent=`${Math.round(dp)}%`;document.querySelector('#distanceBar').style.width=`${dp}%`;
    document.querySelector('#scoreDash').textContent=String(state.score||0).padStart(4,'0');
    document.querySelector('#hullDash').textContent='◆ '.repeat(Math.max(0,state.hull||0)).trim()||'DESTROYED';
    const replyFresh=lastStateAt>0&&performance.now()-lastStateAt<1500;
    missionSeconds+=state.connected&&replyFresh&&state.status==='flying'&&(!gestureOn||calPhase==='flight')?dt:0;const secs=Math.floor(missionSeconds);document.querySelector('#timeDash').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
    const connection=document.querySelector('#connection');connection.classList.toggle('online',replyFresh&&!!state.connected);connection.textContent=!replyFresh?'UNO Q 資料流停滯，重連中…':state.connected?'遊戲已連線':'等待遊戲控制資料';
    updateCockpitState();
    const message=document.querySelector('#message'),title=document.querySelector('#msgTitle'),sub=document.querySelector('#msgSub'),reset=document.querySelector('#reset');let visible=false;
    if(state.status==='landed'){title.textContent='DESTINATION REACHED';sub.textContent='靜海空間站接駁程序啟動';visible=true;}
    else if(state.status==='energy_low'){title.textContent='能源不足';sub.textContent='剩餘能源無法支援抵達後的降落';visible=true;}
    else if(state.status==='energy_empty'){title.textContent='能源耗盡';sub.textContent='飛船失去推進能力';visible=true;}
    else if(state.status==='destroyed'){title.textContent='飛船嚴重受損';sub.textContent='隕石撞擊摧毀了船體';visible=true;}
    else if(state.status==='preflight'){visible=false;}
    else if(!replyFresh){title.textContent='UNO Q 資料暫停';sub.textContent='正在重新連線；恢復後飛行會繼續';visible=true;}
    else if(!state.connected&&!gestureOn){title.textContent='等待飛船控制器';sub.textContent='請按右側攝影機按鈕，或在手機開啟控制頁';visible=true;}
    else if(state.distance>27){title.textContent='接近目的地';sub.textContent='穿越最後一段隕石帶';visible=true;}
    message.classList.toggle('show',visible);reset.classList.toggle('show',['landed','energy_low','energy_empty','destroyed'].includes(state.status));
  }

  let lastTime=performance.now();
  function animate(now){
    requestAnimationFrame(animate);const dt=Math.min(.04,(now-lastTime)/1000||0);lastTime=now;
    updateTakeoff(now);
    const replyFresh=lastStateAt>0&&now-lastStateAt<1500;
    const live=replyFresh&&state.connected&&state.status==='flying'&&(!gestureOn||calPhase==='flight'),boost=live&&!!state.boost;
    document.querySelector('#boostBlur').classList.toggle('active',boost);
    document.querySelector('#impactFlash').classList.toggle('active',now<impactUntil);
    if(live){
      // Tilt accelerates the ship through world space; beta-positive raises altitude.
      const [x,y]=flightInput(now);
      pilotVelocity.x+=THREE.MathUtils.clamp(x,-1,1)*32*dt;
      pilotVelocity.y+=THREE.MathUtils.clamp(y,-1,1)*32*dt;
      pilotVelocity.clampLength(0,13);
      pilotVelocity.multiplyScalar(Math.exp(-1.65*dt));
      camera.position.addScaledVector(pilotVelocity,dt);
      camera.position.x=THREE.MathUtils.clamp(camera.position.x,-34,34);
      camera.position.y=THREE.MathUtils.clamp(camera.position.y,-25,25);
      const pitch=THREE.MathUtils.clamp(y,-1,1)*.13,yaw=-THREE.MathUtils.clamp(x,-1,1)*.11;
      camera.rotation.x+=(pitch-camera.rotation.x)*Math.min(1,dt*5);
      camera.rotation.y+=(yaw-camera.rotation.y)*Math.min(1,dt*5);
      // Match the ship's world position to the same approach value used by the mission rules.
      const targetFlightZ=-500*Math.min(1,(state.distance||0)/30);
      if(now>=impactUntil)camera.position.z+=(targetFlightZ-camera.position.z)*Math.min(1,dt*8);
    }
    for(let i=0;i<stars.length;i++){
      const s=stars[i];
      // Move the star field even when approach data pauses, so forward motion is visible.
      s.z+=dt*(boost?125:18);
      if(s.z-camera.position.z>5)placeFieldPoint(s);
      starPositions[i*3]=s.x;starPositions[i*3+1]=s.y;starPositions[i*3+2]=s.z;
    }
    starGeometry.attributes.position.needsUpdate=true;
    const lineArray=streakGeometry.attributes.position.array;
    for(let i=0;i<streaks.length;i++){
      const s=streaks[i];
      s.z+=dt*(boost?170:24);
      if(s.z-camera.position.z>4)placeFieldPoint(s,18,220);
      const len=boost?Math.min(28,7+s.speed*1.25):s.len,k=i*6;
      lineArray[k]=s.x;lineArray[k+1]=s.y;lineArray[k+2]=s.z;lineArray[k+3]=s.x;lineArray[k+4]=s.y;lineArray[k+5]=s.z-len;
    }
    streakGeometry.attributes.position.needsUpdate=true;streakField.material.opacity=boost?.95:.34;
    station.position.set(0,0,-520);
    station.rotation.z=now*.00012;station.rotation.y=Math.sin(now*.00018)*.045;
    if(live){
      if(spawnTimer<=0){spawnMeteor();spawnTimer=boost?rand(.5,.78):rand(.72,1.05);}else spawnTimer-=dt;
    }
    camera.updateMatrixWorld(true);
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];if(live){m.group.position.addScaledVector(m.velocity,m.speed*dt);m.group.rotation.x+=m.spinX*dt;m.group.rotation.y+=m.spinY*dt;m.group.rotation.z+=m.spinZ*dt;}
      const local=camera.worldToLocal(m.group.position.clone());
      if(live&&Math.abs(local.z)<m.radius+1.6&&Math.hypot(local.x,local.y)<m.radius+1.15){
        makeExplosion(m.group.position);disposeGroup(m.group);meteors.splice(i,1);impactUntil=now+700;sendGameEvent('collision');continue;
      }
      if(local.z>m.radius+8){disposeGroup(m.group);meteors.splice(i,1);}
    }
    for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.life+=dt;const alpha=Math.max(0,1-s.life*3);s.beam.children.forEach((part,j)=>{part.material.opacity=alpha*[.3,.86,1,1][j];});if(s.life>.32){camera.remove(s.beam);s.beam.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});shots.splice(i,1);}}
    for(let i=explosions.length-1;i>=0;i--){
      const e=explosions[i];e.life+=dt;const pos=e.points.geometry.attributes.position.array;
      for(let j=0;j<e.vel.length;j++){pos[j*3]+=e.vel[j][0]*dt;pos[j*3+1]+=e.vel[j][1]*dt;pos[j*3+2]+=e.vel[j][2]*dt;}
      e.points.geometry.attributes.position.needsUpdate=true;e.points.material.opacity=Math.max(0,1-e.life/.72);
      if(e.life>.72){scene.remove(e.points);e.points.geometry.dispose();e.points.material.dispose();explosions.splice(i,1);}
    }
    if(state.status==='landed'&&camera.position.z>-520)camera.position.z-=dt*2;
    updateHud(dt);renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);addEventListener('resize',resize);
</script>
</body>
</html>
